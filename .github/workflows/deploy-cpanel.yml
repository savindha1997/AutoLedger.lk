name: Deploy to cPanel

on:
  push:
    branches:
      - savindhamac
  workflow_dispatch:

concurrency:
  group: cpanel-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application files
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          ssh -p "$CPANEL_SSH_PORT" "$CPANEL_USERNAME@$CPANEL_HOST" "mkdir -p '$CPANEL_DEPLOY_PATH'"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dbconfig.php' \
            --exclude='.env' \
            -e "ssh -p $CPANEL_SSH_PORT" \
            ./ "$CPANEL_USERNAME@$CPANEL_HOST:$CPANEL_DEPLOY_PATH/"