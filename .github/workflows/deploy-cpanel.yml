name: Deploy to cPanel

on:
  push:
    branches:
      - savindhamac
  workflow_dispatch:

concurrency:
  group: cpanel-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve cPanel deployment config
        env:
          RAW_CPANEL_HOST: ${{ secrets.CPANEL_HOST || vars.CPANEL_HOST }}
          RAW_CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME || vars.CPANEL_USERNAME }}
          RAW_CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH || vars.CPANEL_DEPLOY_PATH }}
          RAW_CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || vars.CPANEL_SSH_PORT || '22' }}
          RAW_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          RAW_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS || vars.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -n "$RAW_CPANEL_HOST" ] || missing+=("CPANEL_HOST")
          [ -n "$RAW_CPANEL_USERNAME" ] || missing+=("CPANEL_USERNAME")
          [ -n "$RAW_CPANEL_DEPLOY_PATH" ] || missing+=("CPANEL_DEPLOY_PATH")
          [ -n "$RAW_SSH_PRIVATE_KEY" ] || missing+=("CPANEL_SSH_PRIVATE_KEY")
          [ -n "$RAW_SSH_KNOWN_HOSTS" ] || missing+=("CPANEL_SSH_KNOWN_HOSTS")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required cPanel deployment settings: ${missing[*]}"
            echo "::error::Set these as repository secrets (recommended) or repository variables where supported."
            exit 1
          fi

          {
            echo "CPANEL_HOST=$RAW_CPANEL_HOST"
            echo "CPANEL_USERNAME=$RAW_CPANEL_USERNAME"
            echo "CPANEL_DEPLOY_PATH=$RAW_CPANEL_DEPLOY_PATH"
            echo "CPANEL_SSH_PORT=$RAW_CPANEL_SSH_PORT"
            echo "SSH_PRIVATE_KEY<<EOF"
            printf '%s\n' "$RAW_SSH_PRIVATE_KEY"
            echo "EOF"
            echo "SSH_KNOWN_HOSTS<<EOF"
            printf '%s\n' "$RAW_SSH_KNOWN_HOSTS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application files
        run: |
          ssh -p "$CPANEL_SSH_PORT" "$CPANEL_USERNAME@$CPANEL_HOST" "mkdir -p '$CPANEL_DEPLOY_PATH'"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dbconfig.php' \
            --exclude='.env' \
            -e "ssh -p $CPANEL_SSH_PORT" \
            ./ "$CPANEL_USERNAME@$CPANEL_HOST:$CPANEL_DEPLOY_PATH/"